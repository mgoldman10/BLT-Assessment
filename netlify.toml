[build]
  command = "npm install --prefix netlify/functions && npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # Using default bundler (zip-it-and-ship-it) instead of esbuild
  # because firebase-admin has native dependencies that esbuild can't bundle

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
