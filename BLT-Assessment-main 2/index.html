<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Breakthrough Leadership Assessment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                black: '#212121',
                orange: '#FF3C00',
                grey: '#C6C6C6',
                dark: '#121212', // Slightly darker than brand black for depth
                light: '#f8fafc'
              }
            },
            fontFamily: {
              sans: ['Montserrat', 'Inter', 'sans-serif'], // Default to brand font
              body: ['Inter', 'sans-serif'] // Keep Inter for dense reading if needed
            }
          }
        }
      }
    </script>
    <style>
      html, body {
        /* Ensure the document can scroll normally on screen */
        height: 100%;
        margin: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }
      body {
        font-family: 'Montserrat', sans-serif;
        background-color: #212121; /* Brand Black */
        color: #FFFFFF;
      }
      #root {
        min-height: 100%;
      }

      @media print {
        @page {
            size: auto;
            margin: 10mm 10mm 15mm 10mm;
        }
        html, body, #root {
            height: auto !important;
            min-height: 0 !important;
            overflow: visible !important;
            position: static !important;
            width: 100% !important;
            display: block !important;
        }
        body {
            background-color: white !important;
            color: black !important;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            padding-bottom: 0;
        }
        /* Force background colors to print (for charts) */
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        .no-print, .print-hidden {
            display: none !important;
        }
        .page-break {
            break-before: page;
            page-break-before: always;
            display: block;
            height: 1px; /* Ensure it takes up space in flow */
            width: 100%;
        }
        /* Reset heights for print to allow full content flow */
        .min-h-screen {
            min-height: 0 !important;
            height: auto !important;
        }
        /* Fix for chrome to ensure footer repeats */
        .print-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            padding-bottom: 5mm;
            border-top: 1px solid #e2e8f0;
            z-index: 100;
        }
        /* Prevent elements from being cut in half */
        .break-inside-avoid {
            break-inside: avoid;
            page-break-inside: avoid;
        }
        /* Adjust report container to fill print width */
        .report-container {
            max-width: 100% !important;
            width: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #212121; 
      }
      ::-webkit-scrollbar-thumb {
        background: #404040; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FF3C00; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "firebase/": "https://aistudiocdn.com/firebase@^12.6.0/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
